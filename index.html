<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trebuchet 3D – Máy bắn đá</title>
<style>
:root{--pbg:rgba(24,18,10,.74);--pfg:#f6ecd9;--acc:#e0922f}
html,body{height:100%;margin:0;overflow:hidden;background:#5f7791;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block}
.panel{position:absolute;background:var(--pbg);color:var(--pfg);border-radius:12px;padding:10px 14px;font-size:13px;backdrop-filter:blur(6px)}
#hud{left:10px;top:calc(env(safe-area-inset-top,0px) + 10px);line-height:1.65;min-width:175px}
#hud b{color:var(--acc)}#hud small{opacity:.7}
#bar{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:94vw}
button{font:inherit;font-weight:600;border:0;border-radius:9px;padding:9px 18px;cursor:pointer;color:#fff;background:var(--acc)}
button.s{background:#5b4a35}button:disabled{opacity:.45;cursor:default}
label{display:flex;flex-direction:column;gap:2px;font-size:12px}
input[type=range]{width:110px}select{font:inherit}
</style></head><body>
<div id="hud" class="panel"><div style="font-weight:700;font-size:15px">Trebuchet – máy bắn đá</div>
Trạng thái: <b id="st">Sẵn sàng</b><br>Tầm bắn: <b id="dist">–</b><br>Độ cao tối đa: <b id="hmax">–</b><br>Tốc độ ném: <b id="v0">–</b><br>
<small>Kéo chuột để xoay · cuộn để zoom</small></div>
<div id="bar" class="panel">
<button id="fire">🔥 Bắn!</button><button id="reset" class="s">↺ Nạp lại</button>
<label>Đối trọng: <span id="cwv">120</span> kg<input id="cw" type="range" min="60" max="220" step="10" value="120"></label>
<label>Dây ném: <span id="lv">3.2</span> m<input id="ln" type="range" min="2.4" max="4.2" step="0.1" value="3.2"></label>
<label>Tốc độ<select id="sp"><option value="1">1×</option><option value=".5">0.5×</option><option value=".25">0.25×</option></select></label>
<label><span><input id="fl" type="checkbox" checked> Camera theo đá</span></label>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const T=THREE,v=(x,y,z)=>new T.Vector3(x,y,z),$=id=>document.getElementById(id);
const g=9.8,H=5.8,Ll=5.8,Ls=1.8,D=Math.PI/180,BEND=8*D;
const P={cw:120,L:3.2};
const scene=new T.Scene();scene.background=new T.Color(0x6f869e);scene.fog=new T.Fog(0x6f869e,70,340);
const cam=new T.PerspectiveCamera(50,1,.1,700);cam.position.set(-13,7.5,19);
const ren=new T.WebGLRenderer({antialias:true});ren.shadowMap.enabled=true;ren.shadowMap.type=T.PCFSoftShadowMap;
ren.outputEncoding=T.sRGBEncoding;ren.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(ren.domElement);
const oc=new T.OrbitControls(cam,ren.domElement);oc.target.set(0,3.5,0);oc.maxPolarAngle=1.5;oc.enableDamping=true;
scene.add(new T.HemisphereLight(0x9fb6d0,0x3a2f1e,.38));
const sun=new T.DirectionalLight(0xffdcae,.75);sun.position.set(14,32,22);sun.target.position.set(12,0,0);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:100});
scene.add(sun,sun.target);
function cv(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'));return c}
function tex(c){const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.encoding=T.sRGBEncoding;return t}
// sky
const sky=new T.Mesh(new T.SphereGeometry(500,24,12),new T.MeshBasicMaterial({side:T.BackSide,fog:false,depthWrite:false,map:new T.CanvasTexture(cv(4,256,x=>{const q=x.createLinearGradient(0,0,0,256);q.addColorStop(0,'#1b3f6e');q.addColorStop(.45,'#456e98');q.addColorStop(.52,'#6f869e');q.addColorStop(1,'#6f869e');x.fillStyle=q;x.fillRect(0,0,4,256)}))}));scene.add(sky);
for(let i=0;i<14;i++){const c=new T.Group();for(let j=0;j<5;j++){const s=new T.Mesh(new T.SphereGeometry(7+Math.random()*7,10,8),new T.MeshBasicMaterial({color:0xaab4c0,transparent:true,opacity:.5,fog:false}));s.position.set(j*10-20+Math.random()*5,Math.random()*3,Math.random()*8);s.scale.y=.5;c.add(s)}
c.position.set(-150+Math.random()*450,85+Math.random()*40,-200+Math.random()*400);scene.add(c)}
// terrain
const sm=t=>(t=Math.min(1,Math.max(0,t)),t*t*(3-2*t));
const ell=(x,z)=>Math.hypot((x-25)/85,z/40);
const nz=(x,z)=>.5+.5*(Math.sin(x*.021+z*.013)*Math.cos(z*.017-x*.006)+.5*Math.sin(x*.047+1.3)*Math.sin(z*.05)+.25*Math.sin(x*.11)*Math.cos(z*.09));
const hf=(x,z)=>sm((ell(x,z)-1)/.7)*Math.max(0,-4+44*nz(x,z)*nz(x*.7+50,z*.7));
const tg0=new T.PlaneGeometry(760,760,240,240);tg0.rotateX(-Math.PI/2);tg0.translate(60,0,0);
const pa=tg0.attributes.position,cl=new Float32Array(pa.count*3);
const cG=[.27,.38,.17],cF=[.13,.23,.11],cR=[.55,.52,.45],cV=[.52,.47,.37],mx=(a,b,t)=>a.map((q,i)=>q+(b[i]-q)*t);
for(let i=0;i<pa.count;i++){const x=pa.getX(i),z=pa.getZ(i),y=hf(x,z);pa.setY(i,y);
const ro=sm((y-13)/9),fo=sm((y-1)/6)*.75,gv=1-sm((Math.hypot((x-5)/28,z/14)-.5)/.6);
let c=mx(cG,cF,fo);c=mx(c,cR,ro);c=mx(c,cV,gv*(1-ro));const j=.93+Math.random()*.14;cl.set([c[0]*j,c[1]*j,c[2]*j],i*3)}
tg0.setAttribute('color',new T.BufferAttribute(cl,3));tg0.computeVertexNormals();
const terr=new T.Mesh(tg0,new T.MeshStandardMaterial({vertexColors:true,roughness:1}));terr.receiveShadow=true;scene.add(terr);
// trees (instanced)
const dm=new T.Object3D(),fm=new T.MeshStandardMaterial({roughness:1,flatShading:true}),col=new T.Color();
const trIM=new T.InstancedMesh(new T.CylinderGeometry(.12,.2,1,6),new T.MeshStandardMaterial({color:0x5a4028}),420);
const coIM=new T.InstancedMesh(new T.ConeGeometry(1,1,8),fm,900),blIM=new T.InstancedMesh(new T.IcosahedronGeometry(1,1),fm,420);
let nt=0,nc=0,nb=0;
const put=(im,n,x,y,z,sx,sy,sz,c)=>{dm.position.set(x,y,z);dm.scale.set(sx,sy,sz);dm.updateMatrix();im.setMatrixAt(n,dm.matrix);if(c!==undefined){col.setHSL(.27+Math.random()*.06,.4+Math.random()*.15,c+Math.random()*.07);im.setColorAt(n,col)}};
for(let i=0;i<6000&&nt<400;i++){const x=-220+Math.random()*520,z=-190+Math.random()*380,d=ell(x,z);
if(!((Math.abs(z)>13||x<-24)&&Math.abs(x-40)+Math.abs(z)>14)||Math.random()>.1+.9*Math.min(1,Math.max(0,d-.4)))continue;
const y=hf(x,z),s=.8+Math.random()*1.1,k=Math.random(),h=2.2*s;put(trIM,nt++,x,y+h/2,z,s,h,s);
if(k<.4){for(let j=0;j<2;j++)put(coIM,nc,x,y+h*.7+(1.6+j*1.5)*s,z,1.5*s*(1-j*.35),3.2*s,1.5*s*(1-j*.35),.2),nc++}
else if(k<.78)put(blIM,nb,x,y+h+1.2*s,z,2*s,1.6*s,2*s,.27),nb++;
else put(coIM,nc++,x,y+3.8*s,z,.8*s,7*s,.8*s,.15)}
trIM.count=nt;coIM.count=nc;blIM.count=nb;for(const m of[trIM,coIM,blIM]){m.frustumCulled=false;scene.add(m)}
// rocks
const rockM=new T.MeshStandardMaterial({color:0x9c9482,roughness:1,flatShading:true});
function rock(x,z,s){const gm=new T.IcosahedronGeometry(1,1),p=gm.attributes.position;
for(let i=0;i<p.count;i++){const k=1+.22*Math.sin(p.getX(i)*5.1+p.getY(i)*3.7+p.getZ(i)*4.3+s*9);p.setXYZ(i,p.getX(i)*k,p.getY(i)*k,p.getZ(i)*k)}gm.computeVertexNormals();
const m=new T.Mesh(gm,rockM);m.scale.set(s*1.4,s*.85,s*1.1);m.rotation.y=Math.random()*6;m.position.set(x,hf(x,z)+s*.3,z);m.receiveShadow=true;scene.add(m)}
[[-30,-12,3],[-34,-7,2],[-27,-16,2.2],[-28,15,2.6],[-33,19,3.5],[-22,24,2],[30,-20,2.5],[45,22,3],[70,-24,3.5]].forEach(a=>rock(...a));
for(let i=0;i<50;i++){const x=-200+Math.random()*450,z=-170+Math.random()*340;if(ell(x,z)>.85)rock(x,z,2+Math.random()*5)}
// materials
const wood=cv(256,64,x=>{x.fillStyle='#6e4726';x.fillRect(0,0,256,64);for(let i=0;i<110;i++){const y=Math.random()*64;x.strokeStyle=`rgba(${30+Math.random()*30|0},${16+Math.random()*16|0},6,${.1+Math.random()*.22})`;x.lineWidth=.5+Math.random()*2;x.beginPath();x.moveTo(0,y);x.bezierCurveTo(80,y+Math.random()*6-3,170,y+Math.random()*6-3,256,y);x.stroke()}});
const woodMat=new T.MeshStandardMaterial({map:tex(wood),roughness:.92});
const armMat=new T.MeshStandardMaterial({color:0xd2bd8f,roughness:.85});
const iron=new T.MeshStandardMaterial({color:0x2b2b30,metalness:.7,roughness:.45});
const rope=new T.MeshStandardMaterial({color:0xcdb88a,roughness:1});
function add(m,p=scene){m.castShadow=m.receiveShadow=true;p.add(m);return m}
function beam(a,b,w=.28,h=.28,mat=woodMat,p=scene){const d=b.clone().sub(a),l=d.length();const m=new T.Mesh(new T.BoxGeometry(l,w,h),mat);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(v(1,0,0),d.normalize());return add(m,p)}
function seg(m,a,b,r){const d=b.clone().sub(a),l=d.length();m.position.copy(a).add(b).multiplyScalar(.5);m.scale.set(r,l,r);m.quaternion.setFromUnitVectors(v(0,1,0),d.normalize())}
for(let m=10;m<=80;m+=10){const p=new T.Mesh(new T.CylinderGeometry(.05,.05,2),woodMat);p.position.set(m,1,-9);add(p);
const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(cv(128,64,x=>{x.font='bold 40px sans-serif';x.textAlign='center';x.lineWidth=6;x.strokeStyle='#222';x.fillStyle='#fff';x.strokeText(m+' m',64,44);x.fillText(m+' m',64,44)}))}));s.scale.set(2.4,1.2,1);s.position.set(m,2.6,-9);scene.add(s)}
// rope fence
const fp=[];for(let x=-12;x<=14;x+=2.6)fp.push([x,-7],[x,7]);for(let z=-4.4;z<=4.4;z+=2.6)fp.push([-12,z]);
for(const[x,z]of fp){const p=new T.Mesh(new T.CylinderGeometry(.06,.07,1.1),woodMat);p.position.set(x,.55,z);add(p)}
const fl=[];for(let x=-12;x<14;x+=2.6){fl.push(x,.85,-7,x+2.6,.85,-7,x,.85,7,x+2.6,.85,7)}for(let z=-7;z<7;z+=2.6){fl.push(-12,.85,z,-12,.85,Math.min(z+2.6,7))}
const fg=new T.BufferGeometry();fg.setAttribute('position',new T.Float32BufferAttribute(fl,3));scene.add(new T.LineSegments(fg,new T.LineBasicMaterial({color:0xc8b078})));
// frame
const lx=y=>3.2*(1-(y-.15)/(H-.05));
for(const z of[-1,1]){
beam(v(-3.2,.15,z),v(0,H+.1,z),.34,.34);beam(v(3.2,.15,z),v(0,H+.1,z),.34,.34);
for(const y of[1.5,3.6])beam(v(-lx(y),y,z),v(lx(y),y,z),.24,.24);
beam(v(-lx(1.5),1.5,z),v(lx(3.6),3.6,z),.16,.16);beam(v(lx(1.5),1.5,z),v(-lx(3.6),3.6,z),.16,.16);
beam(v(-6.5,.2,z),v(6.5,.2,z),.4,.4);
beam(v(6.2,.35,z),v(.6,5,z),.26,.26);beam(v(-6.2,.35,z),v(-.6,5,z),.26,.26);
beam(v(.1,H+.15,z),v(2.6,5.75,z),.22,.22);beam(v(2.6,5.75,z),v(lx(3.6),3.6,z),.16,.16);
const c=add(new T.Mesh(new T.CylinderGeometry(.32,.32,.14,14),iron));c.rotation.x=Math.PI/2;c.position.set(0,H,z*1.12)}
for(const x of[-6.2,6.2])beam(v(x,.2,-1.4),v(x,.2,1.4),.4,.4);
beam(v(2.6,5.75,-1.25),v(2.6,5.75,1.25),.3,.3);beam(v(0,H+.2,-1.15),v(0,H+.2,1.15),.28,.28);
const ax=add(new T.Mesh(new T.CylinderGeometry(.14,.14,2.6,12),iron));ax.rotation.x=Math.PI/2;ax.position.set(0,H,0);
// trough, stones
add(new T.Mesh(new T.BoxGeometry(9,.08,1),woodMat)).position.set(-6,.06,0);
for(const z of[-.55,.55])beam(v(-10.5,.2,z),v(-1.3,.2,z),.12,.12);
for(const p of[[-1,2.8],[-.2,3.2],[-.7,2.3]]){const s=add(new T.Mesh(new T.SphereGeometry(.4,12,10),new T.MeshStandardMaterial({color:0xe6dfcf,roughness:1})));s.position.set(p[0]-2,.4,p[1]+.6)}
// arm
const armG=new T.Group();armG.position.set(0,H,0);scene.add(armG);
const ag=new T.CylinderGeometry(.11,.21,Ll+Ls,14);ag.rotateZ(-Math.PI/2);
add(new T.Mesh(ag,armMat),armG).position.x=(Ll-Ls)/2;
for(const[x,l,m]of[[-1.3,.14,iron],[0,.14,iron],[Ll-.6,.5,rope],[Ll-1.5,.14,iron]]){const r=add(new T.Mesh(new T.CylinderGeometry(.25-.02*Math.max(0,x),.25-.02*Math.max(0,x),l,14),m),armG);r.rotation.z=Math.PI/2;r.position.x=x}
add(new T.Mesh(new T.SphereGeometry(.13,10,8),iron),armG).position.x=Ll;
// counterweight (octagonal box)
const cwG=new T.Group();scene.add(cwG);
const pin=add(new T.Mesh(new T.CylinderGeometry(.08,.08,1.7,10),iron),cwG);pin.rotation.x=Math.PI/2;
for(const z of[-.6,.6])add(new T.Mesh(new T.BoxGeometry(.1,1.7,.1),iron),cwG).position.set(0,-.85,z);
const og=new T.CylinderGeometry(1,1,1.5,8);og.rotateX(Math.PI/2);og.rotateZ(Math.PI/8);
add(new T.Mesh(og,woodMat),cwG).position.y=-2.65;
for(const z of[-.45,0,.45]){const b=new T.CylinderGeometry(1.03,1.03,.1,8);b.rotateX(Math.PI/2);b.rotateZ(Math.PI/8);add(new T.Mesh(b,iron),cwG).position.set(0,-2.65,z)}
// sling, stone, cables
const cyl=new T.CylinderGeometry(1,1,1,6);
const slingM=add(new T.Mesh(cyl,rope)),ropeA=add(new T.Mesh(cyl,rope)),ropeB=add(new T.Mesh(cyl,rope));
const stone=add(new T.Mesh(new T.SphereGeometry(.28,20,16),new T.MeshStandardMaterial({color:0x8d8d90,roughness:.95})));
const tg=new T.BufferGeometry();tg.setAttribute('position',new T.BufferAttribute(new Float32Array(3*2000),3));tg.setDrawRange(0,0);
const trail=new T.Line(tg,new T.LineBasicMaterial({color:0xffe9a8}));trail.frustumCulled=false;scene.add(trail);
// simulation
const tip=b=>[Ll*Math.cos(b),H+Ll*Math.sin(b)];
let S,speed=1,tn=0;
function reset(){P.cw=+$('cw').value;P.L=+$('ln').value;$('cwv').textContent=P.cw;$('lv').textContent=P.L.toFixed(1);
S={ph:'ready',b:235*D,w:0,rel:false,done:false,psi:0,pw:0,hm:0};
const[sx,sy]=tip(S.b);S.sx=sx;S.sy=sy;S.vx=S.vy=0;const dy=sy-.25;S.bx=sx-Math.sqrt(P.L*P.L-dy*dy);S.by=.25;S.bvx=S.bvy=0;
tg.setDrawRange(0,0);tn=0;$('st').textContent='Sẵn sàng';['dist','hmax','v0'].forEach(i=>$(i).textContent='–');$('fire').disabled=false}
function step(h){
if(S.ph==='ready')return;
const I=60+P.cw*Ls*Ls+Ll*Ll*1.5;
S.w+=(P.cw*g*Ls*Math.cos(S.b)-1.5*S.w)/I*h;S.b+=S.w*h;
if(S.b<BEND){S.b=BEND;S.w=0}
const[sx,sy]=tip(S.b),vx=(sx-S.sx)/h,vy=(sy-S.sy)/h,ax=(vx-S.vx)/h,ay=(vy-S.vy)/h;
S.sx=sx;S.sy=sy;S.vx=vx;S.vy=vy;const L=P.L;
if(S.ph==='slide'){const dy=sy-.25;
if(dy>L*.85){const sn=(S.bx-sx)/L,cs=(sy-S.by)/L;S.psi=Math.atan2(sn,cs);S.pw=((S.bvx-vx)*Math.cos(S.psi)+(S.bvy-vy)*Math.sin(S.psi))/L;S.ph='swing'}
else{const nx=sx-Math.sqrt(L*L-dy*dy);S.bvx=(nx-S.bx)/h;S.bvy=0;S.bx=nx;S.by=.25}}
else{
S.pw+=-(g*Math.sin(S.psi)+ax*Math.cos(S.psi)+ay*Math.sin(S.psi))/L*h;S.psi+=S.pw*h;
S.bx=sx+L*Math.sin(S.psi);S.by=sy-L*Math.cos(S.psi);
const bvx=vx+L*S.pw*Math.cos(S.psi),bvy=vy+L*S.pw*Math.sin(S.psi);
if(!S.rel&&((S.b<115*D&&bvx>0&&bvy>0&&Math.atan2(bvy,bvx)<=.8)||S.b<12*D)){
S.rel=true;S.px=S.bx;S.py=S.by;S.pvx=bvx;S.pvy=bvy;S.hm=S.py;$('st').textContent='Đá bay!';
$('v0').textContent=Math.hypot(bvx,bvy).toFixed(1)+' m/s ('+(Math.atan2(bvy,bvx)/D).toFixed(0)+'°)'}}
if(S.rel&&!S.done){S.px+=S.pvx*h;S.py+=S.pvy*h;S.pvy-=g*h;S.hm=Math.max(S.hm,S.py);
if(++tn%8===0&&tn/8<2000){const a=tg.attributes.position;a.setXYZ(tn/8-1|0,S.px,S.py,0);tg.setDrawRange(0,tn/8|0);a.needsUpdate=true}
$('hmax').textContent=S.hm.toFixed(1)+' m';
if(S.py<=.28&&S.pvy<0){S.py=.28;if(Math.abs(S.pvy)>3){S.pvy*=-.3;S.pvx*=.6}else{S.done=true;$('st').textContent='Đã rơi';$('dist').textContent=S.px.toFixed(1)+' m'}}}
if(S.rel&&!S.done)$('dist').textContent=S.px.toFixed(1)+' m'}
function pose(){
armG.rotation.z=S.b;cwG.position.set(-Ls*Math.cos(S.b),H-Ls*Math.sin(S.b),0);
const e=v(S.bx,S.by,0);seg(slingM,v(S.sx,S.sy,0),e,.04);
const ck=S.ph==='ready';ropeA.visible=ropeB.visible=ck;
if(ck){const a=[3.4*Math.cos(S.b),H+3.4*Math.sin(S.b)];seg(ropeA,v(a[0],a[1],.3),v(-2.2,.15,.3),.022);seg(ropeB,v(a[0],a[1],-.3),v(-2.2,.15,-.3),.022)}
if(S.rel)stone.position.set(S.px,S.py,0);else stone.position.copy(e);
stone.rotation.z=S.rel?-S.px*.7:0}
let last=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05)*speed;last=t;
if(S.ph!=='ready'){const n=Math.ceil(dt/(1/480)),h=dt/n;for(let i=0;i<n;i++)step(h)}
pose();sky.position.copy(cam.position);
if($('fl').checked){const q=S.rel?v(Math.max(S.px,0)*.8,Math.max(S.py,2),0):v(0,3.5,0);
const d=q.sub(oc.target).multiplyScalar(.05);oc.target.add(d);cam.position.add(d)}
oc.update();ren.render(scene,cam)}
function size(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
$('fire').onclick=()=>{if(S.ph==='ready'){S.ph='slide';$('st').textContent='Đang bắn…';$('fire').disabled=true}};
$('reset').onclick=reset;$('cw').oninput=$('ln').oninput=reset;$('sp').onchange=e=>speed=+e.target.value;
reset();requestAnimationFrame(loop);
</script></body></html>
